<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tibet Watch — བོད་དོན་གསར་འགྱུར།</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tibetan:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12100e; --panel: #1c1917; --panel-2: #241f1c; --line: #38312c;
    --text: #ece7e1; --muted: #a09488; --accent: #d4a24c; --accent-dim: #8a6a2f;
    --ok: #7fa86b; --warn: #d97a6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .tibetan {
    font-family: "Noto Serif Tibetan", "Microsoft Himalaya", "Kailasa", "Jomolhari", serif;
    line-height: 2.15; font-size: 16.5px;
  }
  header { border-bottom: 1px solid var(--line); padding: 18px 26px 0; }
  .brand { display: flex; align-items: baseline; gap: 13px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .brand .bo { color: var(--accent); font-size: 17px; }
  .brand .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; align-items: flex-end; }
  #runbtn {
    margin-left: 18px; margin-bottom: 6px; background: var(--accent); color: #221a09;
    font-weight: 600; border: 0; border-radius: 7px; padding: 9px 18px;
    font-size: 13.5px; cursor: pointer;
  }
  #runbtn:disabled { opacity: .55; cursor: default; }
  #runbtn.busy { background: var(--accent-dim); color: var(--text); }
  .runhint { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
  #runpanel {
    display: none; margin-bottom: 22px; background: var(--panel);
    border: 1px solid var(--accent-dim); border-radius: 9px; padding: 14px 16px;
  }
  #runpanel.on { display: block; }
  #runstage { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  #runlog {
    font: 12px/1.65 ui-monospace, Consolas, monospace; color: var(--muted);
    max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  }
  #runlog .warn { color: var(--warn); }
  .tab {
    padding: 9px 18px; cursor: pointer; font-size: 14px; color: var(--muted);
    border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0;
  }
  .tab.on { background: var(--panel); border-color: var(--line); color: var(--text); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 26px 60px; }
  .view { display: none; } .view.on { display: block; }

  /* status strip */
  #status {
    display: flex; gap: 22px; flex-wrap: wrap; padding: 11px 16px; margin-bottom: 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    font-size: 12.5px; color: var(--muted);
  }
  #status b { color: var(--text); font-weight: 600; }
  #status .bad { color: var(--warn); }

  /* newsletter */
  .issuebar { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 13px; font-size: 14px; font-family: inherit;
  }
  button { cursor: pointer; }
  .langtoggle { display: flex; gap: 5px; margin-left: auto; }
  .langtoggle span {
    padding: 6px 13px; border-radius: 6px; cursor: pointer; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  }
  .langtoggle span.on { background: var(--accent-dim); color: var(--text); border-color: var(--accent-dim); }
  #intro {
    background: var(--panel-2); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 16px 19px; margin-bottom: 28px; font-size: 15.5px;
  }
  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--accent); margin: 34px 0 4px; font-weight: 600;
    border-bottom: 1px solid var(--line); padding-bottom: 9px;
  }
  .story { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .story h3 { margin: 0 0 9px; font-size: 17px; line-height: 1.42; font-weight: 600; }
  .story h3.tibetan { font-size: 17px; }
  .story p { margin: 0 0 11px; }
  .srcs { font-size: 12.5px; color: var(--muted); }
  .srcs a { color: var(--accent); text-decoration: none; }
  .srcs a:hover { text-decoration: underline; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px;
    background: var(--panel-2); border: 1px solid var(--line); margin-right: 6px;
    color: var(--muted);
  }
  .pill.hot { border-color: var(--accent-dim); color: var(--accent); }
  .hidden { display: none; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .empty code { background: var(--panel); padding: 2px 7px; border-radius: 4px; color: var(--accent); }

  /* ask */
  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; padding: 12px 15px; border-radius: 8px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); font-size: 15px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent-dim); }
  #go { background: var(--accent); color: #221a09; font-weight: 600; border: 0; padding: 12px 22px; }
  #go:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 13px 0 0; }
  .chip {
    padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  }
  .chip:hover { border-color: var(--accent-dim); color: var(--text); }
  .asklayout { display: grid; grid-template-columns: 1fr 330px; gap: 22px; margin-top: 24px; }
  @media (max-width: 900px) { .asklayout { grid-template-columns: 1fr; } }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  #trace {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    max-height: 440px; overflow-y: auto;
  }
  .step { margin-bottom: 9px; word-break: break-word; }
  .step .tag { color: var(--accent); }
  .step .obs { color: var(--muted); }
  .step .err { color: var(--warn); }
  .spinner {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--accent-dim); border-top-color: transparent;
    animation: spin .8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Tibet Watch</h1>
    <span class="bo tibetan">བོད་དོན་གསར་འགྱུར།</span>
    <span class="sub">powered by Monlam AI &middot; melong</span>
  </div>
  <div class="tabs">
    <div class="tab on" data-view="newsletter">Newsletter</div>
    <div class="tab" data-view="ask">Ask the archive</div>
    <button id="runbtn" title="Crawl the sources, then compose a fresh issue">Run the agent</button>
    <span class="runhint" id="runhint">crawl + compose &middot; a few minutes &middot; ~0.2 in credits</span>
  </div>
</header>

<main>
  <div id="status">loading…</div>

  <div id="runpanel">
    <div id="runstage">Starting…</div>
    <div id="runlog"></div>
  </div>

  <section class="view on" id="view-newsletter">
    <div class="issuebar">
      <select id="issuepick"></select>
      <span id="issuemeta" class="srcs"></span>
      <div class="langtoggle">
        <span data-lang="en" class="on">English</span>
        <span data-lang="bo" class="tibetan">བོད་ཡིག</span>
        <span data-lang="both">Both</span>
      </div>
    </div>
    <div id="intro" class="hidden"></div>
    <div id="issue"></div>
  </section>

  <section class="view" id="view-ask">
    <form id="form">
      <input type="text" id="q" autocomplete="off"
             placeholder="Ask the archive — e.g. political prisoners, Dalai Lama succession, plateau mining">
      <button type="submit" id="go">Search</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="asklayout">
      <div>
        <h2>Findings</h2>
        <div id="overview" class="hidden" style="background:var(--panel-2);border-left:3px solid var(--accent);border-radius:6px;padding:15px 18px;margin-bottom:18px"></div>
        <div id="cards"></div>
        <div id="spend" class="srcs" style="margin-top:16px"></div>
      </div>
      <div>
        <h2>Agent trace</h2>
        <div id="trace"><span style="color:var(--muted)">Idle. Ask a question to start.</span></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let LANG = "en";
let CURRENT = null;

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
    document.querySelectorAll(".view").forEach(v =>
      v.classList.toggle("on", v.id === "view-" + tab.dataset.view));
  };
});

/* ---------- status strip ---------- */
async function loadStatus() {
  try {
    const s = await (await fetch("/api/stats")).json();
    const c = s.corpus;
    const bad = s.unhealthy > 0;
    $("#status").innerHTML =
      `<span><b>${c.articles}</b> articles crawled</span>` +
      `<span><b>${c.with_text}</b> with full text</span>` +
      `<span><b>${s.window_ready}</b> ready for the next issue</span>` +
      `<span class="${bad ? "bad" : ""}"><b>${s.feeds.length - s.unhealthy}/${s.feeds.length}</b> feeds healthy</span>` +
      (s.latest_issue ? `<span>latest issue <b>${esc(s.latest_issue.id)}</b> (${esc(s.latest_issue.status)})</span>` : "");
  } catch { $("#status").textContent = "could not load status"; }
}

/* ---------- newsletter ---------- */
document.querySelectorAll(".langtoggle span").forEach(btn => {
  btn.onclick = () => {
    LANG = btn.dataset.lang;
    document.querySelectorAll(".langtoggle span").forEach(b => b.classList.toggle("on", b === btn));
    if (CURRENT) renderIssue(CURRENT);
  };
});

async function loadIssues() {
  const { issues } = await (await fetch("/api/issues")).json();
  const pick = $("#issuepick");
  if (!issues.length) {
    pick.innerHTML = "<option>no issues yet</option>";
    $("#issue").innerHTML =
      `<div class="empty">No issue has been composed yet.<br><br>
       Run <code>python crawl.py --once</code> then <code>python compose.py</code>.</div>`;
    return;
  }
  pick.innerHTML = issues.map(i =>
    `<option value="${esc(i.id)}">${esc(i.id)} — ${i.story_count || 0} stories (${esc(i.status)})</option>`).join("");
  pick.onchange = () => openIssue(pick.value);
  openIssue(issues[0].id);
}

async function openIssue(id) {
  const issue = await (await fetch(`/api/issues/${encodeURIComponent(id)}`)).json();
  CURRENT = issue;
  renderIssue(issue);
}

// A newsletter reads better with one language choice for the whole issue than
// with a toggle on every story.
function renderIssue(issue) {
  $("#issuemeta").textContent =
    `${issue.window_start?.slice(0, 10)} to ${issue.window_end?.slice(0, 10)} · cost ${(issue.cost || 0).toFixed(3)}`;

  const intro = $("#intro");
  intro.textContent = issue.intro || "";
  intro.classList.toggle("hidden", !issue.intro);

  $("#issue").innerHTML = (issue.sections || []).map(sec => `
    <div class="section-title">${esc(sec.section)}</div>
    ${sec.stories.map(story => renderStory(story)).join("")}
  `).join("") || `<div class="empty">This issue has no stories.</div>`;
}

function renderStory(s) {
  const showEn = LANG === "en" || LANG === "both";
  const showBo = LANG === "bo" || LANG === "both";
  const hot = s.source_count > 1;
  return `
    <div class="story">
      ${showEn && s.headline_en ? `<h3>${esc(s.headline_en)}</h3>` : ""}
      ${showEn && s.summary_en ? `<p>${esc(s.summary_en)}</p>` : ""}
      ${showBo && s.headline_bo ? `<h3 class="tibetan">${esc(s.headline_bo)}</h3>` : ""}
      ${showBo && s.summary_bo ? `<p class="tibetan">${esc(s.summary_bo)}</p>` : ""}
      <div class="srcs">
        <span class="pill ${hot ? "hot" : ""}">${s.source_count} outlet${s.source_count > 1 ? "s" : ""}</span>
        ${s.sources.map(src => `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.source)}</a>`).join(" · ")}
      </div>
    </div>`;
}

/* ---------- ask the archive ---------- */
["Tibetan political prisoners", "Dalai Lama succession", "colonial boarding schools",
 "mining on the Tibetan plateau"].forEach(text => {
  const chip = document.createElement("span");
  chip.className = "chip"; chip.textContent = text;
  chip.onclick = () => { $("#q").value = text; $("#form").requestSubmit(); };
  $("#chips").appendChild(chip);
});

function log(html, cls = "") {
  const div = document.createElement("div");
  div.className = "step " + cls; div.innerHTML = html;
  $("#trace").appendChild(div); $("#trace").scrollTop = $("#trace").scrollHeight;
}

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("#q").value.trim();
  if (!question) return;

  $("#go").disabled = true;
  $("#trace").innerHTML = ""; $("#cards").innerHTML = "";
  $("#overview").classList.add("hidden"); $("#spend").textContent = "";
  log(`<span class="tag">question</span> ${esc(question)} <span class="spinner"></span>`);

  try {
    const resp = await fetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();

      for (const chunk of chunks) {
        if (!chunk.startsWith("data:")) continue;
        const ev = JSON.parse(chunk.slice(5).trim());
        if (ev.type === "action") {
          log(`<span class="tag">&rarr; ${esc(ev.tool)}</span> ${esc(ev.input)}`);
        } else if (ev.type === "observation") {
          log(`<span class="obs">&larr; ${esc((ev.content || "").split("\n")[0].slice(0, 150))}</span>`);
        } else if (ev.type === "overview") {
          $("#overview").textContent = ev.content;
          $("#overview").classList.remove("hidden");
        } else if (ev.type === "done") {
          $("#cards").innerHTML = (ev.articles || []).map(a => `
            <div class="story">
              <h3>${esc(a.title || "(untitled)")}</h3>
              <p>${esc(a.summary_en || "")}</p>
              ${a.summary_bo ? `<p class="tibetan">${esc(a.summary_bo)}</p>` : ""}
              <div class="srcs">
                <span class="pill">${esc(a.source)}</span>
                <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>
              </div>
            </div>`).join("");
          const sp = ev.spend || {};
          $("#spend").textContent =
            `${(ev.articles || []).length} articles · ${sp.calls || 0} model calls · cost ${(sp.cost || 0).toFixed(4)}`;
          log(`<span style="color:var(--ok)">done — ${(ev.articles || []).length} articles</span>`);
        } else if (ev.type === "error") {
          log(`<span class="err">error: ${esc(ev.message)}</span>`);
        }
      }
    }
  } catch (err) {
    log(`<span class="err">request failed: ${esc(String(err))}</span>`);
  } finally {
    $("#go").disabled = false;
    document.querySelectorAll(".spinner").forEach(s => s.remove());
  }
};

/* ---------- run the pipeline ---------- */
// The button is disabled for the whole run and the server holds a lock as
// well, because a second run would contend for SQLite and spend real money
// producing a draft that overwrites the first.
$("#runbtn").onclick = async () => {
  const btn = $("#runbtn");
  btn.disabled = true; btn.classList.add("busy"); btn.textContent = "Running…";
  $("#runpanel").classList.add("on");
  $("#runstage").textContent = "Starting…";
  $("#runlog").textContent = "";

  const append = (line, cls = "") => {
    const span = document.createElement("span");
    span.className = cls; span.textContent = line + "\n";
    $("#runlog").appendChild(span);
    $("#runlog").scrollTop = $("#runlog").scrollHeight;
  };

  try {
    const resp = await fetch("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ crawl: true, compose: true, use_gdelt: false }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const chunks = buffer.split("\n\n");
      buffer = chunks.pop();

      for (const chunk of chunks) {
        if (!chunk.startsWith("data:")) continue;
        const ev = JSON.parse(chunk.slice(5).trim());
        if (ev.type === "stage") {
          $("#runstage").textContent = ev.message;
          append("— " + ev.message);
        } else if (ev.type === "log") {
          append(ev.message, /WARNING|FAIL|GAP/.test(ev.message) ? "warn" : "");
        } else if (ev.type === "error") {
          $("#runstage").textContent = "Failed";
          append(ev.message, "warn");
        } else if (ev.type === "done") {
          const cost = ev.spend ? ` · cost ${(ev.spend.cost || 0).toFixed(3)}` : "";
          $("#runstage").textContent =
            ev.error ? `Finished with a problem: ${ev.error}`
                     : `Done — issue ${ev.issue_id || "(none)"}${cost}`;
          await loadStatus();
          await loadIssues();     // pick up the fresh draft
        }
      }
    }
  } catch (err) {
    $("#runstage").textContent = "Request failed";
    append(String(err), "warn");
  } finally {
    btn.disabled = false; btn.classList.remove("busy"); btn.textContent = "Run the agent";
  }
};

loadStatus();
loadIssues();
</script>
</body>
</html>
